
version: 2

models:
  - name: films
    description: "This table contains details about films"
    columns:
      - name: film_id
        description: "Primary key of the films table"
        tests:
          - unique
          - not_null
      - name: title
        description: "Title of the film"
        tests:
          - not_null
      - name: release_date
        description: "Date the film was released"
      - name: price
        description: "Rental/purchase price of the film"
      - name: rating
        description: "MPAA content rating (e.g. PG-13, R)"
      - name: user_rating
        description: "Average user rating, between 1 and 5"

  - name: actors
    description: "This table contains details about actors"
    columns:
      - name: actor_id
        description: "Primary key of the actors table"
        tests:
          - unique
          - not_null
      - name: actor_name
        description: "Full name of the actor"
        tests:
          - not_null

  - name: film_actors
    description: "Mapping table between films and actors"
    columns:
      - name: film_id
        description: "Foreign key to films.film_id"
        tests:
          - not_null
          - relationships:
              to: ref('films')
              field: film_id
      - name: actor_id
        description: "Foreign key to actors.actor_id"
        tests:
          - not_null
          - relationships:
              to: ref('actors')
              field: actor_id

  - name: films_ratings
    description: "Films enriched with a qualitative rating bucket and their cast"
    columns:
      - name: film_id
        description: "Primary key of the films table"
        tests:
          - unique
          - not_null
      - name: title
        description: "Title of the film"
        tests:
          - not_null
      - name: film_rating
        description: "Qualitative bucket derived from user_rating (Excellent/Good/Average/Poor)"
        tests:
          - accepted_values:
              values: ['Excellent', 'Good', 'Average', 'Poor']
      - name: actors
        description: "Comma-separated list of actors in the film"
